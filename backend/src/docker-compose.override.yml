# Lido automaticamente pelo Visual Studio junto com o docker-compose.yml.
services:
  sbar-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Sbar: "Host=sbar-db;Port=5432;Database=sbar;Username=sbar;Password=sbar"
    ports:
      # 5185 no host = mesma porta que o proxy do Vite (frontend/vite.config.ts) já espera.
      - "5185:8080"

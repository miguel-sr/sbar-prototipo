name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore backend/src/Sbar.CI.slnf
      - run: dotnet build backend/src/Sbar.CI.slnf --no-restore --configuration Release
      - run: dotnet test backend/src/Sbar.CI.slnf --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage
      # Cobertura: só informa (resumo do job e artifact HTML); ainda não bloqueia o merge por limiar.
      - name: Relatório de cobertura do backend
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          "$HOME/.dotnet/tools/reportgenerator" "-reports:coverage/**/coverage.cobertura.xml" "-targetdir:coverage/relatorio" "-reporttypes:Html;MarkdownSummaryGithub" "-assemblyfilters:+Sbar.*;-*.Tests" "-classfilters:-*Migrations*"
          cat coverage/relatorio/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: coverage/relatorio
          retention-days: 7
          if-no-files-found: ignore

  # Front: typecheck, build de produção e testes unitários/de componente (Vitest). Roda em paralelo
  # ao job do backend — feedback rápido, sem navegador nem banco.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run build
      - run: npm run test:cov
      - name: Resumo da cobertura do front
        if: always()
        run: |
          node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const l = ['lines', 'statements', 'branches', 'functions'].map((k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + ' de ' + t[k].total + ' |');
          console.log('## Cobertura do front (Vitest)\n\n| Métrica | % | Cobertos |\n|---|---|---|\n' + l.join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-front
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: ignore

  # E2E (Playwright, só Chromium): navegador real + API real + Postgres real. Só roda se o backend
  # e o front básicos passaram (não gasta minutos de navegador à toa). O próprio playwright.config.ts
  # sobe a API (porta 5195, banco `sbar_e2e`, criado pelo Migrate() do startup) e o front (build de
  # produção via `vite preview`, porta 5175).
  # NOTA: `build-and-push-image` (abaixo) AINDA NÃO depende deste job — decisão pendente: bloquear
  # a publicação da imagem quando o E2E falhar? (Se sim: acrescentar `e2e` ao `needs` dele.)
  e2e:
    needs: [build-and-test, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sbar
          POSTGRES_PASSWORD: sbar
          POSTGRES_DB: sbar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbar -d sbar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Compilar a API (falha de compilação aparece aqui, não como timeout do webServer)
        run: dotnet build ../backend/src/Sbar.Api/Sbar.Api.csproj --configuration Debug
      - name: Cache do Chromium do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Relatório e traces do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
